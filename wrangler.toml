name = "waitron-server"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Variáveis públicas (não sensíveis)
# ============================================================
[vars]
ENV = "production"
APP_URL = "https://ws.droppfy.com"
ZERNIO_BASE = "https://api.zernio.com"
ASAAS_BASE = "https://api-sandbox.asaas.com"          # troque para https://api.asaas.com em produção
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
AI_PROVIDER = "auto"                                  # auto | grok | workers-ai (com fallback para Llama)
GROK_MODEL = "grok-4-fast-non-reasoning"              # ajuste conforme o modelo xAI disponível na conta
ALLOWED_ORIGIN = "https://ws.droppfy.com,https://droppfy.com,https://www.droppfy.com,https://waitron-server.contatodroppfy.workers.dev,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8787"
HOTEL_ALLOW_ANON = "false"                            # true apenas para kiosks legados sem login
EXPOSE_RESET_TOKEN = "false"

# ============================================================
# Banco de dados D1
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "noxmob-db"
database_id = "4d97efa0-a40e-421b-97e4-b331b7195acf"
migrations_dir = "../migrations"

# ============================================================
# Workers AI (Llama) + xAI Grok opcional
# Grok exige o secret XAI_API_KEY; se ele falhar, o Worker usa Llama.
# ============================================================
[ai]
binding = "AI"

# ============================================================
# PWA / arquivos estáticos (index.html, manifest, sw.js, ícones)
# O .assetsignore na raiz impede o upload de worker/, .git e segredos.
# ============================================================
[assets]
directory = "../"
binding = "ASSETS"

# ============================================================
# Limpeza diária (sessões, tokens, auditoria antiga)
# ============================================================
[triggers]
crons = ["17 3 * * *"]

# ============================================================
# mTLS (necessário para Apple Pay e, em produção, Banco Inter)
# Crie o certificado no dashboard Cloudflare > SSL/TLS > Client Certificates
# e descomente com o certificate_id correspondente.
# ============================================================
# [[mtls_certificates]]
# binding = "INTER_MTLS"
# certificate_id = "SUBSTITUA_PELO_ID_DO_CERTIFICADO"
#
# [[mtls_certificates]]
# binding = "APPLE_PAY_MTLS"
# certificate_id = "SUBSTITUA_PELO_ID_DO_CERTIFICADO"

# ============================================================
# Observabilidade
# ============================================================
[observability]
enabled = true

# ============================================================
# Secrets (configure com: npx wrangler secret put NOME -c worker/wrangler.toml)
# ============================================================
# BOOTSTRAP_TOKEN         token único para criar o primeiro admin
# XAI_API_KEY             chave da API xAI (Grok) — opcional
# ZERNIO_API_KEY          chave da API Zernio
# ZERNIO_ACCOUNT_ID       conta WhatsApp no Zernio
# ZERNIO_PROFILE_ID       perfil Zernio (opcional)
# ZERNIO_WEBHOOK_SECRET   segredo HMAC do webhook /webhook/zernio
# ASAAS_API_KEY           chave Asaas
# ASAAS_WEBHOOK_TOKEN     token do webhook Asaas
# INTER_CLIENT_ID         Banco Inter
# INTER_CLIENT_SECRET     Banco Inter
# INTER_PIX_CHAVE         chave PIX Inter
# UPI_VPA                 VPA indiana para UPI/Google Pay (opcional)
# APPLE_PAY_MERCHANT_ID   Apple Pay (opcional)
# APPLE_PAY_DOMAIN        domínio verificado no Apple Pay
# APPLE_PAY_DOMAIN_ASSOCIATION  conteúdo do arquivo apple-developer-merchantid-domain-association
# APPLE_PAY_PROCESSOR_URL PSP que processa o token Apple Pay
# RESEND_API_KEY          envio de e-mail de recuperação de senha
# RESET_FROM              remetente verificado no Resend
# HOTEL_API_KEY           chave dos dispositivos de palma/frigobar
# API_KEY                 chave de integração máquina-a-máquina
# PALM_KEY                chave AES-256 (base64, 32 bytes) para criptografar templates
